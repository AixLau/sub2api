services:
  sub2api-blue:
    extends:
      file: docker-compose.local.yml
      service: sub2api
    image: ${SUB2API_BLUE_IMAGE:-weishaw/sub2api:latest}
    container_name: sub2api-blue
    mem_limit: ${SUB2API_BLUE_MEMORY_LIMIT:-1536m}
    ports: !override
      - "127.0.0.1:${SUB2API_BLUE_PORT:-8081}:8080"
    profiles:
      - blue-green

  sub2api-green:
    extends:
      file: docker-compose.local.yml
      service: sub2api
    image: ${SUB2API_GREEN_IMAGE:-weishaw/sub2api:latest}
    container_name: sub2api-green
    mem_limit: ${SUB2API_GREEN_MEMORY_LIMIT:-1536m}
    ports: !override
      - "127.0.0.1:${SUB2API_GREEN_PORT:-8082}:8080"
    profiles:
      - blue-green
