<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAI OAuth Transport</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <h1>OpenAI OAuth 出站传输</h1>
        <p>使用宿主已授权的 OpenAI OAuth 账号访问 Responses 上游。</p>
      </header>

      <form id="config-form">
        <label>
          <span>上游 Base URL</span>
          <input id="upstream_base_url" name="upstream_base_url" type="url" required />
          <small>默认：Basis Points Responses 入口。请勿在 URL 中填写 Token。</small>
        </label>

        <label>
          <span>原生端点 Base URL（留空则用宿主原始 URL）</span>
          <input id="native_upstream_base_url" name="native_upstream_base_url" type="url" />
          <small>可选。原生通道回退时转发到的 Codex 端点；留空表示使用宿主下发的原始请求 URL。</small>
        </label>

        <div class="grid">
          <label>
            <span>代理模式</span>
            <select id="proxy_mode" name="proxy_mode">
              <option value="account">使用账号代理</option>
              <option value="disabled">禁用代理</option>
            </select>
          </label>
          <label>
            <span>TLS 最低版本</span>
            <select id="tls_min_version" name="tls_min_version">
              <option value="1.2">TLS 1.2</option>
              <option value="1.3">TLS 1.3</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label><span>请求超时（秒）</span><input id="request_timeout_seconds" type="number" min="1" max="600" /></label>
          <label><span>响应头超时（秒）</span><input id="response_header_timeout_seconds" type="number" min="1" max="120" /></label>
          <label><span>空闲连接超时（秒）</span><input id="idle_connection_timeout_seconds" type="number" min="1" max="600" /></label>
          <label><span>最大空闲连接数</span><input id="max_idle_connections" type="number" min="1" max="1000" /></label>
          <label><span>每主机空闲连接数</span><input id="max_idle_connections_per_host" type="number" min="1" max="100" /></label>
        </div>

        <label class="checkbox"><input id="enable_http2" type="checkbox" /> <span>启用 HTTP/2</span></label>

        <label>
          <span>BPS 桥接模型范围</span>
          <select id="bps_model_mode" name="bps_model_mode">
            <option value="all">全部模型（默认）</option>
            <option value="selected">仅指定模型</option>
          </select>
          <small>仅指定模型时，名单外的模型直接走原生端点，不受下方原生通道回退开关影响。</small>
        </label>
        <label>
          <span>允许走 BPS 的模型（每行一个）</span>
          <textarea id="bps_models" name="bps_models" rows="4" spellcheck="false" aria-describedby="bps-models-help" disabled></textarea>
          <small id="bps-models-help">填写插件收到的请求模型名，区分大小写并精确匹配，不支持通配符；在模型映射及去除 -excel 后缀之前匹配，最多 64 个。选择“仅指定模型”且名单为空时，全部走原生端点。名单内的请求仍遵循下方图片和工具路由规则。</small>
        </label>

        <label class="checkbox"><input id="native_fallback" type="checkbox" /> <span>启用原生通道回退（图片/图片生成等走原生端点）</span></label>

        <label class="checkbox"><input id="tools_via_native" type="checkbox" /> <span>携带客户端工具的请求走原生通道（exec_command 等原生可调）</span></label>

        <label>
          <span>额外请求头（JSON 对象）</span>
          <textarea id="extra_headers" rows="5" spellcheck="false">{}</textarea>
          <small>Authorization、账号 ID、Host 等身份请求头由宿主和插件管理，不能在这里覆盖。</small>
        </label>

        <label>
          <span>模型映射（JSON 对象：请求模型 → 上游模型）</span>
          <textarea id="model_mapping" rows="5" spellcheck="false">{}</textarea>
          <small>仅在 BPS 通道生效。例：{"gpt-6-astra-basispoints":"gpt-6-astra"}。BPS 请求中未映射的模型自动去掉 -excel 后缀；原生通道不改写模型名。</small>
        </label>

        <div class="actions">
          <button id="save" type="submit">保存配置</button>
          <button id="test" type="button" class="secondary">校验配置</button>
          <span id="message" role="status"></span>
        </div>
      </form>

      <section class="status">
        <strong>运行状态</strong>
        <span id="status">加载中…</span>
      </section>
      <p id="status-detail" aria-live="polite"></p>
      <details class="diagnostics">
        <summary>最近故障诊断（脱敏）</summary>
        <p>保留本次插件进程最近 50 条故障，重启后清空。可复制请求 ID 或完整诊断用于排查；每 10 秒刷新。</p>
        <pre id="diagnostics-detail">暂无故障诊断</pre>
      </details>
    </main>
    <script src="assets/bridge-v1.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
