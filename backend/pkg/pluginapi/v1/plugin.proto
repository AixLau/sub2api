syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Wei-Shaw/sub2api/pkg/pluginapi/v1;pluginv1";

service TransportPlugin {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
  rpc TestConfig(TestConfigRequest) returns (TestConfigResponse);
  // PrepareOutbound lets a stateful plugin participate in the host's
  // outbound request immediately before the host sends it upstream. The
  // plugin may add or remove an explicitly allowed set of headers (for
  // example, a short-lived Codex turn-state ticket) without taking over the
  // HTTP/SSE/WebSocket transport itself. Plugins that do not implement the
  // hook return UNIMPLEMENTED and the host continues the normal path.
  rpc PrepareOutbound(PrepareOutboundRequest) returns (PrepareOutboundResponse);
  rpc Forward(stream ForwardRequest) returns (stream ForwardResponse);
  // InitHostServices hands the plugin a go-plugin broker stream id it can dial
  // back to reach the host-provided HostService. It is an optional, generic
  // lifecycle hook: plugins built against an older contract leave it
  // Unimplemented and the host simply runs without offering host services.
  rpc InitHostServices(InitHostServicesRequest) returns (InitHostServicesResponse);
  // ObserveOutboundResponse gives stateful plugins a response-header feedback
  // point after the host receives upstream headers. It is intentionally
  // separate from PrepareOutbound: a plugin may learn a rotated ticket or
  // cookie without becoming part of the response transport. The response is
  // advisory and never changes the bytes returned to the client.
  rpc ObserveOutboundResponse(ObserveOutboundResponseRequest) returns (ObserveOutboundResponseResponse);
}

// HostService is implemented by the host and dialed by the plugin over the
// go-plugin broker id delivered via InitHostServices. It exposes generic,
// capability-neutral facilities that any plugin may use; new facilities are
// added here as new RPCs without changing the transport contract version.
service HostService {
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVSet(KVSetRequest) returns (KVSetResponse);
  rpc KVDelete(KVDeleteRequest) returns (KVDeleteResponse);
  rpc KVList(KVListRequest) returns (KVListResponse);
  // Account directory: enumerate the accounts the plugin is bound to act on
  // (with full readable metadata) and resolve the outbound identity
  // (credentials/headers/proxy) the host would attach to a live request. The
  // host restricts both calls to the account scope the requesting plugin's
  // declared capabilities cover; a plugin can never widen that scope. Metadata
  // never carries raw credentials — those are only handed out by
  // ResolveOutboundIdentity, the dedicated (equally sensitive) credential channel.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc ResolveOutboundIdentity(ResolveOutboundIdentityRequest) returns (ResolveOutboundIdentityResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string plugin_id = 1;
  string plugin_version = 2;
  uint32 protocol_version = 3;
  uint32 transport_api_version = 4;
  repeated string capabilities = 5;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string message = 2;
  // status_json is an optional plugin-defined JSON blob describing current runtime
  // state (e.g. a status summary for the config UI). It MUST be produced passively
  // — reading it must not apply config, reach upstream, or cause side effects — so
  // the host can expose it via a lightweight, ungated status endpoint. Ignored by
  // the host's health gating.
  string status_json = 3;
}

message ValidateConfigRequest {
  bytes config_json = 1;
}

message ValidateConfigResponse {
  bool valid = 1;
  string message = 2;
  bytes normalized_config_json = 3;
}

message ApplyConfigRequest {
  bytes config_json = 1;
}

message ApplyConfigResponse {
  bool applied = 1;
  string message = 2;
}

message TestConfigRequest {
  bytes config_json = 1;
}

message TestConfigResponse {
  bool success = 1;
  string message = 2;
  int64 latency_ms = 3;
  // status_json is an optional plugin-defined JSON blob surfaced to the config UI
  // alongside the test result (e.g. a runtime status summary). Ignored by the host.
  string status_json = 4;
}

// HeaderHookAction controls whether the host should proceed with the
// prepared outbound request. CONTINUE is also used for a plugin no-op. A
// REJECT response is authoritative for the current request and includes a
// machine-readable reason_code for host diagnostics.
enum HeaderHookAction {
  HEADER_HOOK_ACTION_UNSPECIFIED = 0;
  HEADER_HOOK_ACTION_CONTINUE = 1;
  HEADER_HOOK_ACTION_REJECT = 2;
}

message HeaderValues {
  repeated string values = 1;
}

// PrepareOutboundRequest is a metadata-only snapshot. The host owns the
// actual connection and request body. `headers` contains the headers visible
// to the hook; hosts SHOULD omit credentials and other secrets unless a
// declared plugin capability explicitly needs them. Plugins MUST NOT persist
// this snapshot or use it to alter account identity.
message PrepareOutboundRequest {
  string request_id = 1;
  string method = 2;
  string url = 3;
  string host = 4;
  map<string, HeaderValues> headers = 5;
  string proxy_url = 6;
  int64 account_id = 7;
  string model = 8;
  // http, sse, websocket, or another host-defined outbound transport label.
  string transport = 9;
  string platform = 10;
  string account_type = 11;
  int64 content_length = 12;
  bool has_body = 13;
}

message PrepareOutboundResponse {
  HeaderHookAction action = 1;
  // The host validates these against its protected-header policy before
  // applying them. A plugin cannot use this map to replace authorization,
  // cookies, proxy settings, or billing headers.
  map<string, HeaderValues> headers_to_set = 2;
  repeated string headers_to_delete = 3;
  string reason_code = 4;
  string message = 5;
  // Optional hint for a host retry or cooldown. It does not itself trigger a
  // retry and is ignored when action is CONTINUE.
  int64 retry_after_ms = 6;
}

// ObserveOutboundResponse carries response metadata only. `headers` may
// include Set-Cookie and other sensitive values when the plugin capability
// explicitly declares that it needs them; plugins MUST apply their own
// redaction and persistence policy. The host owns the response body and does
// not send it through this hook.
message ObserveOutboundResponseRequest {
  string request_id = 1;
  int64 account_id = 2;
  string model = 3;
  string transport = 4;
  int32 status_code = 5;
  string status = 6;
  map<string, HeaderValues> headers = 7;
  bool request_sent = 8;
  string sent_ticket_state = 9;
  string platform = 10;
  string account_type = 11;
}

message ObserveOutboundResponseResponse {
  bool observed = 1;
  string reason_code = 2;
  string message = 3;
}

message ForwardRequestStart {
  string request_id = 1;
  string method = 2;
  string url = 3;
  string host = 4;
  map<string, HeaderValues> headers = 5;
  string proxy_url = 6;
  int64 account_id = 7;
  int32 account_concurrency = 8;
  string platform = 9;
  string account_type = 10;
  int64 content_length = 11;
  bool has_body = 12;
  // Host can receive trusted per-inference usage frames. Plugins must not
  // combine multiple billable inferences when the host lacks this facility.
  bool accepts_usage_attempts = 13;
}

message ForwardRequest {
  oneof frame {
    ForwardRequestStart start = 1;
    bytes body_chunk = 2;
    bool body_end = 3;
  }
}

message ForwardResponseStart {
  int32 status_code = 1;
  string status = 2;
  string protocol = 3;
  int32 protocol_major = 4;
  int32 protocol_minor = 5;
  map<string, HeaderValues> headers = 6;
  int64 content_length = 7;
}

message ForwardResponseEnd {
  int64 bytes_received = 1;
  int64 duration_ms = 2;
}

message ForwardResponseError {
  string code = 1;
  string message = 2;
  bool request_sent = 3;
}

// One actual upstream inference, before any aggregation or protocol rewrite.
// These frames are private to the host/plugin transport, never HTTP content.
message ForwardResponseUsage {
  int32 attempt = 1;
  string request_id = 2;
  string response_id = 3;
  string model = 4;
  string service_tier = 5;
  int64 started_at_unix_ms = 6;
  int64 duration_ms = 7;
  bytes usage_json = 8;
}

message ForwardResponse {
  oneof frame {
    ForwardResponseStart start = 1;
    bytes body_chunk = 2;
    ForwardResponseEnd end = 3;
    ForwardResponseError error = 4;
    ForwardResponseUsage usage = 5;
  }
}

message InitHostServicesRequest {
  // host_service_id is the broker stream id the plugin dials to reach HostService.
  uint32 host_service_id = 1;
  // host_service_api_version lets the plugin reject a host it cannot talk to.
  uint32 host_service_api_version = 2;
}

message InitHostServicesResponse {
  // ready is true once the plugin has successfully dialed back the host service.
  bool ready = 1;
  string message = 2;
}

// KV messages back a namespaced, per-plugin persistent key-value store. The
// host derives the owning plugin from the runtime that serves the connection,
// so a plugin can never read or write another plugin's namespace.
message KVGetRequest {
  string namespace = 1;
  string key = 2;
}

message KVGetResponse {
  bool found = 1;
  bytes value = 2;
}

message KVSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  // ttl_seconds > 0 sets an expiry; 0 stores the entry without expiry.
  int64 ttl_seconds = 4;
}

message KVSetResponse {}

message KVDeleteRequest {
  string namespace = 1;
  string key = 2;
}

message KVDeleteResponse {}

message KVListRequest {
  string namespace = 1;
  string key_prefix = 2;
  int32 limit = 3;
}

message KVListResponse {
  repeated string keys = 1;
}

message ListAccountsRequest {
  string platform = 1;
  string account_type = 2;
}

message ListAccountsResponse {
  // account_ids is retained for plugins built against host_service_api_version 1.
  // The host keeps filling it (the ids of the accounts in `accounts`) so those
  // plugins keep working; new plugins should read `accounts` instead.
  repeated int64 account_ids = 1;
  // accounts carries the full readable metadata for every account in the
  // plugin's scope — including active accounts that are currently NOT
  // schedulable because they are paused (rate-limited / temp-unschedulable /
  // overloaded). This lets a plugin make its own decisions (e.g. skip paused
  // accounts) instead of hammering them. (Administratively disabled / expired
  // accounts are already excluded upstream by the host.) Available when
  // host_service_api_version >= 2.
  repeated AccountInfo accounts = 2;
}

// AccountInfo is the host's readable, non-secret view of one account. It never
// contains credentials (token / refresh_token / cookies); use
// ResolveOutboundIdentity for those.
//
// The typed fields are a small, STABLE decision core. Everything else about the
// account — including any field added to the account model later — is carried in
// metadata_json, so new fields reach plugins WITHOUT a contract change, a host
// mapper edit, or a plugin rebuild. Only a newly added *secret* field would ever
// require a host change (a one-line denylist entry), which is the safe default.
message AccountInfo {
  int64  id = 1;
  string platform = 2;
  string account_type = 3;
  string name = 4;
  // status is the coarse lifecycle state: active / disabled / error / expired.
  string status = 5;
  // schedulable is the host-authoritative decision (IsSchedulable) — false when
  // the account is active but paused for ANY reason (rate limit,
  // temp-unschedulable, overload, expiry auto-pause, quota). This is the primary
  // signal a plugin should use to skip an account so it stops probing paused ones.
  bool   schedulable = 6;
  bool   is_shadow = 7;
  // metadata_json is a host-produced JSON object holding the account's readable
  // field set (status timestamps, rate-limit / overload / temp-unschedulable
  // windows and reason, last-used, expiry, session window, group ids, priority,
  // concurrency, quota dimension, extra config, proxy, and any future field).
  // Keys are the account model's field names. Times are RFC3339 strings (JSON
  // null when unset). Only two things are withheld: the raw Credentials blob
  // (the refresh_token — a long-lived secret the outbound-identity RPC does not
  // hand out; the short-lived access token and proxy URL come from that RPC), and
  // the Groups/AccountGroups relation graphs (cyclic — group_ids conveys
  // membership). Plugins read whatever keys they need; the host does not have to
  // change when the account model gains a field.
  bytes  metadata_json = 20;
}

message ResolveOutboundIdentityRequest {
  int64 account_id = 1;
}

message ResolveOutboundIdentityResponse {
  bool found = 1;
  int64 account_id = 2;
  string platform = 3;
  string account_type = 4;
  string proxy_url = 5;
  string token = 6;
  map<string, HeaderValues> headers = 7;
}
