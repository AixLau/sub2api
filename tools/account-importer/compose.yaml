name: sub2api-account-importer
services:
  importer:
    image: ${ACCOUNT_IMPORT_IMAGE:?Set ACCOUNT_IMPORT_IMAGE to a versioned image}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    environment:
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-http://127.0.0.1:8080}
      SUB2API_ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
    secrets:
      - admin_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  admin_api_key:
    file: ./secrets/admin-api-key
